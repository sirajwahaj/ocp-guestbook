name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: production-deploy
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  CONFIG_REPO: your-org/your-config-repo # <-- change this

jobs:
  # -------------------------------------------------
  # 1️⃣ TEST BACKEND
  # -------------------------------------------------
  test:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.0"
          cache-dependency-path: backend/go.sum

      - name: Run Tests
        run: |
          cd backend
          make test

  # -------------------------------------------------
  # 2️⃣ BUILD & PUSH (MULTI-ARCH)
  # -------------------------------------------------
  build-and-push:
    name: Build and Push Images
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      id-token: write

    strategy:
      matrix:
        component: [backend, frontend]

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Generate Version Tag
        id: version
        run: |
          SHORT_SHA=$(echo $GITHUB_SHA | cut -c1-7)
          VERSION="1.0.${GITHUB_RUN_NUMBER}-${SHORT_SHA}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Generated version: ${VERSION}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.component }}
          file: ./${{ matrix.component }}/Containerfile
          push: ${{ github.event_name != 'pull_request' }}
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.component }}:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.component }}:latest
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy Scan
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.component }}:${{ steps.version.outputs.version }}
          format: table
          exit-code: 1
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

  # -------------------------------------------------
  # 3️⃣ DEPLOY (GITOPS UPDATE)
  # -------------------------------------------------
  deploy:
    name: Update Kubernetes Config Repo
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Config Repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.CONFIG_REPO }}
          token: ${{ secrets.GIT_TOKEN }}
          path: config-repo

      - name: Install yq
        run: sudo snap install yq

      - name: Update Backend Image Tag
        run: |
          cd config-repo
          yq -i '.spec.template.spec.containers[0].image = "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:${{ needs.build-and-push.outputs.version }}"' k8s/deployment.yaml

          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git commit -am "Update backend image to ${{ needs.build-and-push.outputs.version }}"
          git push

  # -------------------------------------------------
  # 4️⃣ DISCORD NOTIFICATION
  # -------------------------------------------------
  notify:
    name: Discord Notification
    needs: [test, build-and-push, deploy]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Send Discord Message
        uses: appleboy/discord-action@master
        with:
          webhook_id: ${{ secrets.DISCORD_WEBHOOK_ID }}
          webhook_token: ${{ secrets.DISCORD_WEBHOOK_TOKEN }}
          message: |
            **Build Status**: ${{ (needs.test.result == 'success' && needs.build-and-push.result == 'success') && '✅ SUCCESS' || '❌ FAILURE' }}
            **Version**: ${{ needs.build-and-push.outputs.version }}
            **Repository**: ${{ github.repository }}
            **Run**: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
